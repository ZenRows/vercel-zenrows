name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Node 22 ships npm 10.9, and trusted publishing needs 11.5.1 or later.
      # Without this the publish falls back to token auth and 401s.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package.json version
        if: github.event_name == 'release'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $GITHUB_REF_NAME ($TAG) does not match package.json version $PKG"
            exit 1
          fi
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test -- --run
      - run: pnpm build
      # Authenticated by the trusted publisher configured on npmjs.com for
      # ZenRows/vercel-zenrows + release.yml. No token, and no --provenance
      # flag: npm attaches provenance automatically when publishing over OIDC.
      #
      # Staged, not direct. That trusted publisher grants `npm stage publish`
      # only, so `npm publish` comes back as "OIDC permission denied for this
      # action". Staging uploads the tarball with its provenance and leaves it
      # for a package maintainer to approve with 2FA:
      #
      #   npm stage list @zenrows/ai-sdk-tools
      #   npm stage approve <stage-id>
      #
      # The release is not on the registry until someone approves it.
      - run: npm stage publish
